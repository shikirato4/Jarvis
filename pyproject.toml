[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-cognitive-os"
version = "0.1.0"
description = "Modular local cognitive operating system core inspired by JARVIS."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "APScheduler>=3.10.4",
  "fastapi>=0.115.0",
  "httpx>=0.28.1",
  "matplotlib>=3.10.0",
  "numpy>=2.1.0",
  "Pillow>=11.2.0",
  "platformdirs>=4.3.0",
  "psutil>=6.0.0",
  "pypdf>=6.1.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.8.0",
  "scipy>=1.17.0",
  "SQLAlchemy>=2.0.40",
  "sympy>=1.14.0",
  "typer>=0.16.0",
  "uvicorn>=0.34.0",
] 

[project.optional-dependencies]
dev = [
  "build>=1.3.0",
  "pytest>=8.3.5",
  "ruff>=0.16.0",
  "wheel>=0.45.0",
]
desktop = [
  "keyring>=25.6.0",
  "PySide6>=6.8.0",
  "mss>=10.0.0",
  "pywin32>=308",
]
image = [
  "accelerate>=1.1.0",
  "diffusers>=0.31.0",
  "safetensors>=0.4.5",
  "transformers>=4.57,<4.58",
]
voice = [
  "faster-whisper>=1.1.1",
  "numpy>=2.1.0",
  "coqui-tts[codec]>=0.27.5,<0.28",
  "torch>=2.11,<2.12",
  "torchaudio>=2.11,<2.12",
  "transformers>=4.57,<4.58",
  "pyttsx3>=2.98",
  "sounddevice>=0.4.7",
]

[project.scripts]
jarvis = "jarvis.cli:app"
jarvis-desktop = "jarvis.desktop:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
  "integration: exercises an explicitly opted-in real external service",
  "e2e: exercises a complete end-to-end path and may require external infrastructure",
]
norecursedirs = [
  ".git",
  ".venv",
  ".venv312",
  ".venv_legacy_src_backup",
  ".pytest_cache",
  ".pytest_tmp",
  "runtime",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Broad families enforced since the 2026-10 quality pass. Rules disabled
# below are deliberate, documented decisions — not oversights.
select = ["E", "F", "W", "UP", "B", "SIM", "ASYNC", "S"]
ignore = [
  # Line length is legacy debt (~6k over 100 chars); tracked separately.
  "E501",
  # Asserts double as runtime invariants in this local app; the test
  # suite obviously asserts by design.
  "S101",
  # "Hardcoded" tokens only appear in test fixtures (fake credentials).
  "S105",
  "S106",
  # Tolerated best-effort cleanup paths; a dedicated pass is pending.
  "S110",
  "S112",
  # urlopen is the fetcher module's job.
  "S310",
  # External feed XML via xml.etree; defusedxml migration pending.
  "S314",
  # subprocess with shell=False is the intended secure pattern here.
  "S603",
  # Popen without a shell, same rationale as S603.
  "S606",
  # Fires on prompt charter prose ("select ... from"); no SQL is executed.
  "S608",
  # Style-only rewrites (contextlib.suppress, if-collapsing, env casing).
  "SIM102",
  "SIM105",
  "SIM112",
  # typer.Option/Argument in defaults is the documented Typer idiom.
  "B008",
  # zip strictness needs a per-site review pass.
  "B905",
  # StrEnum changes str()/format semantics; needs a behavior review.
  "UP042",
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
# Offline research harnesses: dynamic loading and PATH-resolved tools by design.
"scripts/eval_*.py" = ["S102", "S607"]
# Tests exercise the guarded behaviors themselves (shell=True paths, PATH
# binaries, fixture paths); the guards under test live in src/.
"tests/**" = ["S108", "S604", "S607"]
