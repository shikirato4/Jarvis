name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,desktop]"
          # Only the prompt-token-budget test needs a tokenizer; installing
          # just transformers avoids pulling the whole image extra (torch).
          pip install "transformers>=4.57,<4.58"

      - name: Ruff (project rules)
        run: ruff check src

      # No .env is committed, so the suite runs with factory defaults:
      # a clean checkout boots on the registered profile without local models.
      # Qt widgets render offscreen because CI runners have no display.
      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -m "not integration and not e2e"
